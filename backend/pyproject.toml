[project]
name = "intelligent-automl-backend"
version = "0.1.0"
description = "INTELLIGENT AUTOML - Dataset Discovery + Automated Machine Learning backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "boto3>=1.35",
    "cryptography>=43.0",
    "celery>=5.4",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: live network tests (deselected by default)"]

[tool.ruff]
line-length = 100
target-version = "py312"
