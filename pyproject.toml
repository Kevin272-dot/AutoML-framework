[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-automl"
version = "0.1.0"
description = "Adaptive RL-driven AutoML: problem-aware, dataset-aware experiment planning with a human approval gate and deployment-ready model packaging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RLAGENT" }]
keywords = ["automl", "reinforcement-learning", "ppo", "mlops", "hyperparameter-search"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
models = ["xgboost>=2.0", "lightgbm>=4.0"]
rl = ["torch>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17", "skl2onnx>=1.16"]
openml = ["openml>=0.14", "liac-arff>=2.5"]
cli = ["rich>=13.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.8",
    "matplotlib>=3.8",
]

[project.scripts]
automl = "rl_automl.cli.main:main"

[project.urls]
Documentation = "https://github.com/example/rl-automl"

[tool.setuptools.packages.find]
include = ["rl_automl*"]

[tool.setuptools.package-data]
rl_automl = ["configs/*.yaml", "py.typed", "api/static/*.html"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["rl_automl/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
    "network: tests that require internet access",
    "rl: tests that train a policy",
]
filterwarnings = ["ignore::DeprecationWarning:lightgbm.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["rl_automl"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts add the repository root to sys.path before importing the package so
# they can be run directly from anywhere; the imports that follow are not misplaced.
"scripts/*.py" = ["E402"]
# This suite must call pytest.importorskip before importing the optional web stack, so the
# imports that follow the skip are intentionally not at the top of the file.
"rl_automl/tests/test_api.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
exclude = ["rl_automl/tests/"]

[tool.coverage.run]
branch = true
source = ["rl_automl"]
